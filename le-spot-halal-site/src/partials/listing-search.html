<dialog
  class="info-dialog listing-search"
  id="listing-search"
  aria-labelledby="listing-search-title"
>
  <h2 id="listing-search-title">Rechercher un restaurant</h2>
  <form data-listing-search>
    <label for="listing-query">Restaurant, cuisine ou quartier</label>
    <input id="listing-query" name="query" type="search" autocomplete="off" />
    <button type="submit">Rechercher</button>
  </form>
  <form method="dialog"><button type="submit">Fermer</button></form>
</dialog>
