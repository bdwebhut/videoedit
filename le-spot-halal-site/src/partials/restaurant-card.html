<article
  class="restaurant-card restaurant-card--{{variant}}"
  data-restaurant
  data-name="{{name}}"
  aria-labelledby="{{slug}}-title"
>
  <div class="restaurant-card__media">
    <img
      src="assets/images/{{photo}}"
      alt="{{name}}"
      class="restaurant-card__image"
      loading="lazy"
    />
    <span class="restaurant-card__badge">{{badge}}</span>
    {{halal}}
  </div>
  <div class="restaurant-card__body">
    <h3 class="restaurant-card__title" id="{{slug}}-title">
      <button
        class="restaurant-card__link"
        type="button"
        data-action="restaurant"
      >
        {{title}}
      </button>
    </h3>
    <span class="restaurant-card__rating" aria-label="Note : 4,9 sur 5">
      <span class="restaurant-card__mobile-star" aria-hidden="true">★</span>
      <img
        src="assets/icons/8f3b2.svg"
        alt=""
        class="icon"
        aria-hidden="true"
      />
      <span>4.9</span>
    </span>
    <div class="restaurant-card__tags">{{tags}}</div>
    <p class="restaurant-card__quote">{{quote}}</p>
    {{body_indicators}}
  </div>
  {{media_indicators}}
</article>
