<article class="detail-review">
  <div class="detail-review__heading">
    <h3>{{name}}</h3>
    <span class="detail-review__rating" aria-label="5 sur 5">
      <span>{{rating}}</span>
      <span class="detail-review__mobile-star" aria-hidden="true">☆</span>
      <img
        src="assets/icons/e30d9.svg"
        alt=""
        class="icon"
        aria-hidden="true"
      />
    </span>
  </div>
  <p>{{copy}}</p>
</article>
