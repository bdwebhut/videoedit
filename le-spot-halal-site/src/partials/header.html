<header class="site-header">
  <button
    class="site-header__menu"
    type="button"
    aria-label="Ouvrir le menu"
    aria-controls="primary-navigation"
    aria-expanded="false"
    data-menu-toggle
  >
    <img src="assets/icons/7b8b8.svg" alt="" width="44" height="44" />
    <span class="visually-hidden">Menu</span>
  </button>
  <nav
    class="site-header__nav"
    aria-label="Navigation principale"
    id="primary-navigation"
    data-navigation=""
  >
    <a
      class="site-header__link {{nearby_active}}"
      {{nearby_current}}
      href="{{nearby_url}}"
    >
      À proximité
    </a>
    <a
      class="site-header__link {{map_active}}"
      {{map_current}}
      href="map.html"
      data-action="map"
    >
      Carte
    </a>
    <a class="site-header__link" href="{{about_url}}">À propos</a>
  </nav>
  <a
    class="site-header__brand"
    href="index.html"
    aria-label="Le spot halal — Accueil"
  >
    <picture class="responsive-art">
      <source
        media="(max-width: 47.99rem)"
        srcset="assets/icons/{{header_mobile_logo}}"
      />
      <img src="assets/icons/67d68.svg" alt="Le spot halal" />
    </picture>
  </a>
  <div class="site-header__tools">
    <a
      href="{{search_url}}"
      class="site-header__search"
      aria-label="Rechercher un restaurant"
    >
      <picture class="responsive-art">
        <source
          media="(max-width: 47.99rem)"
          srcset="assets/icons/{{header_mobile_search}}"
        />
        <img
          src="assets/icons/2c857.svg"
          alt=""
          class="site-header__search-icon"
          aria-hidden="true"
        />
      </picture>
    </a>
    <a
      class="button button--add site-header__add"
      href="add-restaurant.html"
    >
      <img
        src="assets/icons/2c600.svg"
        alt=""
        class="icon"
        aria-hidden="true"
      />
      <span>Ajouter</span>
    </a>
  </div>
  <img
    src="assets/icons/959cd.svg"
    alt=""
    class="site-header__decoration site-header__decoration--first"
    aria-hidden="true"
  />
  <img
    src="assets/icons/42096.svg"
    alt=""
    class="site-header__decoration site-header__decoration--second"
    aria-hidden="true"
  />
</header>
