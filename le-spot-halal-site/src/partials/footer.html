<footer class="site-footer">
  <picture class="responsive-art">
    <source
      media="(max-width: 47.99rem)"
      srcset="assets/icons/{{footer_mobile_logo}}"
    />
    <img
      src="assets/icons/{{footer_desktop_logo}}"
      alt="Le spot halal"
      class="site-footer__logo"
    />
  </picture>
  <nav class="site-footer__navigation" aria-label="Navigation de pied de page">
    <h2 class="site-footer__heading">Navigation</h2>
    <ul>
      <li><a href="{{nearby_url}}">À proximité</a></li>
      <li><button type="button" data-action="map">Carte</button></li>
      <li><a href="{{about_url}}">À Propos</a></li>
    </ul>
  </nav>
  <div class="site-footer__legal">
    <h2 class="site-footer__heading">Légal</h2>
    <ul>
      <li>Mentions légales</li>
      <li>Confidentialité</li>
      <li>CGU</li>
    </ul>
  </div>
  <div class="site-footer__address">
    <h2 class="site-footer__heading">Adresse</h2>
    <address>
      Annemasse, 74100
      <br />
      France
    </address>
  </div>
  <div class="site-footer__contact" id="contact">
    <h2 class="site-footer__heading">Contactez-nous</h2>
    <a href="mailto:hello@lespothalal.com">hello@lespothalal.com</a>
  </div>
  <p class="site-footer__credits">
    © 2026 le spot halal
    <br />
    Made by Aleph
  </p>
  <a
    class="button button--add site-footer__add"
    href="mailto:hello@lespothalal.com?subject=Ajouter%20mon%20restaurant"
  >
    <img src="assets/icons/2c600.svg" alt="" class="icon" aria-hidden="true" />
    <span>Ajouter mon restaurant</span>
  </a>
</footer>
