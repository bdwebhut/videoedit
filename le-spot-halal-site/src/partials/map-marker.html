<button
  class="map-marker map-marker--{{color}}{{featured_class}}"
  type="button"
  style="{{position_style}}"
  data-marker-target="{{target}}"
  aria-label="Afficher {{name}}"
  aria-pressed="false"
>
  <picture class="responsive-art">
    <source media="(max-width:63.99rem)" srcset="assets/icons/8d991.svg" />
    <img src="assets/icons/{{icon}}" alt="" aria-hidden="true" />
  </picture>
</button>
